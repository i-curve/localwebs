name: Verify and publish Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: npm ci
      - run: npm run build
      - run: go test -race -tags nomsgpack ./...

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || format('{0}/localwebs', secrets.DOCKERHUB_USERNAME) }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=^v(.+)$,group=1
      - name: Check image tags
        if: steps.meta.outputs.tags == ''
        run: |
          echo "::error::No image tag generated. Run this workflow on the default branch or a v-prefixed Git tag."
          exit 1
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: npm ci
      - run: npm run build
      - name: Build release archives
        shell: bash
        run: |
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="localwebs-${os}-${arch}"
            staging="$RUNNER_TEMP/$name"
            mkdir -p "$staging"
            cp -R dist "$staging/dist"
            cp LICENSE "$staging/LICENSE"
            binary=localwebs
            if [ "$os" = windows ]; then binary=localwebs.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -tags nomsgpack -ldflags="-s -w" -o "$staging/$binary" .
            if [ "$os" = windows ]; then
              (cd "$staging" && zip -qr "$GITHUB_WORKSPACE/release/$name.zip" .)
            else
              tar -C "$staging" -czf "$GITHUB_WORKSPACE/release/$name.tar.gz" .
            fi
          done
      - name: Build CLI release archives
        shell: bash
        run: |
          for target in $(go tool dist list | grep -E '^(linux|darwin|windows|freebsd|openbsd|netbsd)/'); do
            os="${target%/*}"
            arch="${target#*/}"
            name="localwebs-cli-${os}-${arch}"
            staging="$RUNNER_TEMP/$name"
            mkdir -p "$staging"
            cp LICENSE "$staging/LICENSE"
            binary=localwebs-cli
            if [ "$os" = windows ]; then binary=localwebs-cli.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -ldflags="-s -w" -o "$staging/$binary" ./cmd/localwebs-cli
            if [ "$os" = windows ]; then
              (cd "$staging" && zip -qr "$GITHUB_WORKSPACE/release/$name.zip" .)
            else
              tar -C "$staging" -czf "$GITHUB_WORKSPACE/release/$name.tar.gz" .
            fi
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="$RUNNER_TEMP/localwebs-commit-notes"
          {
            echo '<!-- localwebs:commits:start -->'
            printf '## Commit history\n\n'
            git log --format='commit %H%nAuthor: %an%nDate: %aI%n%n%B%n' HEAD | sed 's/^/    /'
            echo '<!-- localwebs:commits:end -->'
          } > "$notes"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' > "$RUNNER_TEMP/localwebs-release-tags"
          if grep -Fxq -- "$GITHUB_REF_NAME" "$RUNNER_TEMP/localwebs-release-tags"; then
            gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$RUNNER_TEMP/localwebs-release-body"
            awk '
              $0 == "<!-- localwebs:commits:start -->" { if (inside) exit 1; inside = 1; next }
              $0 == "<!-- localwebs:commits:end -->" { if (!inside) exit 1; inside = 0; next }
              !inside && $0 == "" { blanks++; next }
              !inside { while (blanks > 0) { print ""; blanks-- } print }
              END { if (inside) exit 1 }
            ' "$RUNNER_TEMP/localwebs-release-body" > "$RUNNER_TEMP/localwebs-updated-body"
            printf '\n' >> "$RUNNER_TEMP/localwebs-updated-body"
            cat "$notes" >> "$RUNNER_TEMP/localwebs-updated-body"
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/localwebs-updated-body"
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --notes-file "$notes"
          fi
