name: Verify and publish Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: npm ci
      - run: npm run build
      - run: go test -race -tags nomsgpack ./...

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || format('{0}/localwebs', secrets.DOCKERHUB_USERNAME) }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=^v(.+)$,group=1
      - name: Check image tags
        if: steps.meta.outputs.tags == ''
        run: |
          echo "::error::No image tag generated. Run this workflow on the default branch or a v-prefixed Git tag."
          exit 1
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
